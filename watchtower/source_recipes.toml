# Reviewed, optional public event sources. No installation is changed by this catalog.
[[recipe]]
id = "nb_policy_rate"
name = "Norges Bank – styringsrente"
sector = "finance"
description = "Endret styringsrente; en ny dato med samme rente gir ikke varsel."
official_url = "https://www.norges-bank.no/en/topics/statistics/open-data/"
verified_on = "2026-09-08"
[recipe.source]
kind = "csv_records"
urls = ["https://data.norges-bank.no/api/data/IR/B.KPRA?format=csv&lastNObservations=1&locale=en"]
delimiter = ";"
id_fields = ["INSTRUMENT_TYPE", "TENOR"]
fields = ["OBS_VALUE", "UNIT_MEASURE"]
numeric_fields = ["OBS_VALUE"]
published_field = "TIME_PERIOD"
events = ["changed"]
[recipe.source.where]
TENOR = ["SD"]
[recipe.source.field_labels]
OBS_VALUE = "Styringsrente (%)"
UNIT_MEASURE = "Enhet"
[recipe.source.filter]
match_all = true

[[recipe]]
id = "nb_usd_nok"
name = "Norges Bank – USD/NOK"
sector = "finance"
description = "Kursendring på minst 1 prosent fra sist aksepterte verdi."
official_url = "https://www.norges-bank.no/en/topics/statistics/open-data/"
verified_on = "2026-09-08"
[recipe.source]
kind = "csv_records"
urls = ["https://data.norges-bank.no/api/data/EXR/B.USD.NOK.SP?format=csv&lastNObservations=1&locale=en"]
delimiter = ";"
id_fields = ["BASE_CUR", "QUOTE_CUR", "TENOR"]
fields = ["OBS_VALUE", "UNIT_MULT"]
numeric_fields = ["OBS_VALUE"]
published_field = "TIME_PERIOD"
events = ["changed"]
[recipe.source.thresholds.OBS_VALUE]
percent = 1.0
[recipe.source.field_labels]
OBS_VALUE = "NOK per USD"
UNIT_MULT = "Enhetsfaktor"
[recipe.source.filter]
match_all = true

