[[recipe]]
id = "met_severe_weather"
name = "MET – oransje og røde farevarsler"
sector = "transport"
description = "Publiserte alvorlige farevarsler i Norge; geografien står i varselet."
official_url = "https://api.met.no/weatherapi/metalerts/2.0/documentation"
verified_on = "2026-09-08"
[recipe.source]
kind = "json_records"
urls = ["https://api.met.no/weatherapi/metalerts/2.0/current.json"]
records_path = "features"
id_fields = ["properties.id"]
fields = ["properties.riskMatrixColor", "properties.description", "properties.consequences", "properties.eventEndingTime"]
title_field = "properties.title"
allow_empty = true
interval_minutes = 60
[recipe.source.where]
"properties.riskMatrixColor" = ["Orange", "Red"]
[recipe.source.field_labels]
"properties.riskMatrixColor" = "Farenivå"
"properties.description" = "Beskrivelse"
"properties.consequences" = "Konsekvenser"
"properties.eventEndingTime" = "Gjelder til"
[recipe.source.filter]
match_all = true

[[recipe]]
