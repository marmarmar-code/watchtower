[[recipe]]
id = "ssb_cpi"
name = "SSB – konsumprisindeksen"
sector = "finance"
description = "Nye KPI-observasjoner og revisjoner i de siste tre månedene."
official_url = "https://www.ssb.no/statbank/table/14700"
verified_on = "2026-09-08"
[recipe.source]
kind = "ssb_data"
table = "14700"
[recipe.source.value_codes]
VareTjenesteGrp = ["00"]
ContentsCode = ["KpiIndMnd"]
Tid = ["top(3)"]
[recipe.source.field_labels]
value = "Indeksverdi"
unit = "Enhet og beregningsgrunnlag"
status = "Datastatus"
[recipe.source.filter]
match_all = true

