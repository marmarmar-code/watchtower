coverage = "Oppdager AD-publikasjoner, inkludert revisjonsnumre, og følger oppførte revisjons-/korrigerings-/erstatningsfelt i valgt utstedelsesvindu. Komplett HTML-paginering krysskontrolleres mot XML; to fulle innlesinger må stemme. Utsteder kan velges eksplisitt. Dekker ikke eldre endringer utenfor vinduet, PDF-innhold, global fullstendighet eller gjeldende status for et bestemt fly."

[[source]]
id = "emission_values"
name = "Norske utslipp – rapporterte stoffmengder per år"
status = "beta"
credential_required = false
interval_class = "custom"
maintenance_owner = "fork-owner"
coverage = "Oppførte årsverdier per valgt anlegg, stoff og medium. Enhet, tall, ikke tilgjengelig og ikke rapportert holdes atskilt. Hele valgte årsspenn valideres i to komplette innlesinger. Stoffvalg følger nettsidens offentlige skjema. Ingen publiseringsdato, overskridelse av tillatelse eller totalsum på tvers av ulike enheter utledes."

[[source]]
id = "frequency_licences"
name = "Nkom – spektrumtillatelser og frekvensoppføringer"
status = "beta"
credential_required = false
interval_class = "custom"
maintenance_owner = "fork-owner"
coverage = "Nye og endrede registerrader med innehaver, frekvensgrenser i Hz, anvendelse, dekning og kildeoppgitt utløpstid. To komplette samlingssvar må stemme. Flere rader kan dele tillatelsesnummer. Generelle fribruks-/amatørregler utelates som standard og kan velges uttrykkelig. Ingen aktiv-status, vedtaksdato eller tilbakekalling utledes."

[[source]]
id = "law_gazette"
name = "Norsk Lovtidend – kunngjøringer og dokumentendringer"
status = "beta"
credential_required = false
interval_class = "custom"
maintenance_owner = "fork-owner"
coverage = "Nye og endrede kunngjøringer i nyeste annonserte enkeltårspakker fra avdeling I. Dokumenttekst, ressursreferanser og utvalgte metadata følges. Kunngjøringstid og kildeoppgitt ikrafttredelse holdes atskilt. Komprimert og utvidet arkiv kontrolleres i to komplette innlesinger. Ingen konsolidert lovtilstand, juridisk virkning eller opphevelse utledes."

[[source]]
id = "efta_procedural_documents"
name = "ESA – prosessdokumenter med saksreferanser"
status = "beta"
credential_required = false
interval_class = "custom"
maintenance_owner = "fork-owner"
coverage = "Nye og endrede eksplisitt valgte dokumenttyper i ESAs offentlige dokumentbase, med land, saksreferanse og oppført dato. Nyeste annonserte år hentes med komplett paginering og to like innlesinger før typefilter. Dokumentnummer og vedleggslenke gir radidentitet. Ingen gjeldende saksstatus, etterlevelse, avslutning eller vedleggsinnhold utledes."

[[source]]
id = "short_positions"
name = "Offentlig rapporterte netto shortposisjoner"
status = "beta"
credential_required = false
interval_class = "custom"
maintenance_owner = "fork-owner"
coverage = "Nyeste oppførte hendelse for valgte ISIN-er fra det dokumenterte offentlige API-et. Kildens samlede prosent og aksjetall samt hver aktive innehaverposisjon følges. To komplette svar valideres før lagring. Datoer beholdes som kildedatoer. Terskelbegrenset offentlig dekning; fravær eller null er ikke bevis på at en posisjon er lukket."

[[source]]
id = "bankruptcy_notices"
name = "Konkurskunngjøringer med separate saksfrister"
status = "beta"
credential_required = false
interval_class = "custom"
maintenance_owner = "fork-owner"
coverage = "Nye og endrede konkursåpningskunngjøringer for foretak med organisasjonsnummer i et kort datovindu. Treffantall, datofilter, dokumentidentitet og to komplette innlesinger kontrolleres. Saksnummer, domstol, bostyrer, åpning, kravfrist, fristdag og skiftesamling er separate kildefelt. Ingen nåværende bostatus eller avslutning utledes fra fravær."

[[source]]
id = "umm_capacity"
name = "Offentlige UMM-kapasitetsmeldinger"
status = "beta"
credential_required = false
interval_class = "custom"
maintenance_owner = "fork-owner"
coverage = "Nye og reviderte kapasitetsmeldinger med norske områdekoder i offentlig RSS. Meldingsidentitet, revisjon, status, kategori, årsakskode og kapasitetstabeller følges. Tabellrekkefølge og tomme felt bevares uten summering eller antatt tidssone. Generelle meldinger og full historikk er utenfor dekningen; fravær betyr ikke gjenoppretting."

[[source]]
id = "dsa_supervision"
name = "DSA-tilsyn per digital tjeneste"
status = "beta"
credential_required = false
interval_class = "custom"
maintenance_owner = "fork-owner"
coverage = "Nye tjenester og endrede daterte tilsynshendelser i Kommisjonens offentlige DSA-oversikt. Tilbyder, kildeoppgitt klassifisering, koordinator, hendelsestekst og offisielle dokumentlenker følges. Foreløpige funn og vedtak beholdes med ulik kildetekst; fravær fastslår ikke avslutning eller oppheving. Brukertall og vedleggsinnhold inngår ikke."

[[source]]
id = "certificate_auctions"
name = "Auksjonsresultater for sentralbanksertifikater"
status = "beta"
credential_required = false
interval_class = "custom"
maintenance_owner = "fork-owner"
coverage = "Nye og endrede publiserte resultater i nyeste annonserte år. Norges Banks paginerte indeks skiller innbydelser fra resultater. Per auksjonsdato og ISIN følges kurs, rente, tildelt volum, budvolum, marginaltildeling, oppgjør og forfall med eksplisitte enheter. To komplette innlesinger kontrolleres; fravær betyr ikke kansellering."

[[source]]
id = "corporate_actions"
name = "Børsmeldinger om selskapsendringer og derivatkontrakter"
status = "beta"
credential_required = false
interval_class = "custom"
maintenance_owner = "fork-owner"
coverage = "Nye og endrede oppføringer i de første avgrensede sidene av børsens offentlige oversikt over selskapsendringer for derivater. Meldingsnummer, utstedelsesdato, oppgitt virkningsdato, hendelsestype, instrumenttekst og PDF-lenkemetadata følges. Ingen beløp eller kontraktsvilkår utledes fra indeksen. Dokumentinnhold og komplett arkiv inngår ikke; fravær betyr ikke kansellering."

[[source]]
id = "rasff_border_rejections"
name = "RASFF – grenseavvisninger av mat, fôr og kontaktmaterialer"
status = "beta"
credential_required = false
interval_class = "custom"
maintenance_owner = "fork-owner"
coverage = "Offentlige meldingssammendrag om grenseavvisninger i et avgrenset datovindu. Produktkategori, type, forhold, kildeoppgitt risiko, meldende land og opprinnelsesland følges. To komplette søkeuttrekk må stemme, med kontroll av sidetotaler, identiteter og anvendte filtre. Ingen detaljdokumenter, merker eller virksomhetsnavn hentes; fravær betyr ikke klarering."

[[source]]
id = "lobbying_finance"
name = "EU-registerets innrapporterte finansopplysninger"
status = "beta"
credential_required = false
interval_class = "custom"
maintenance_owner = "fork-owner"
coverage = "Nye og reviderte finansdeklarasjoner for utvalgte hovedkontorland i det offentlige EU-registeret. Anslåtte kostnadsintervaller for registrerte aktiviteter, betaling til mellommenn, NGO-totalbudsjett, finansieringskilder og tilskudd holdes atskilt. Full eksport kontrolleres to ganger med dato, total og identiteter. Nye organisasjoner uten avsluttet regnskapsår beholdes eksplisitt. Ingen summering eller utledet faktisk påvirkning."
