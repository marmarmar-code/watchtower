[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "watchtower"
version = "0.2.0"
description = "Deterministic public-source monitor with private runtime configuration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
]

[project.scripts]
watchtower = "watchtower.cli:main"

[tool.setuptools.packages.find]
include = ["watchtower*"]

[tool.setuptools.package-data]
watchtower = ["source_catalog.toml"]
