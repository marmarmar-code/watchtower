name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: git diff --check HEAD^
      - run: python -m pip install .
      - run: python -m pip check
      - run: python -m compileall -q watchtower tests scripts
      - run: python scripts/check_public_safety.py
      - run: python scripts/check_source_catalog.py
      - name: Temporary external-contract diagnosis
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import date,timedelta,datetime,timezone
          from urllib.parse import urlsplit
          import requests
          from bs4 import BeautifulSoup
          import watchtower.sources.parliament_vote_discovery as p
          from watchtower.config import SourceConfig, FilterRule
          import traceback
          for org in ('923609016', '976967631'):
              try:
                  r=requests.get('https://data.brreg.no/regnskapsregisteret/regnskap/'+org,timeout=20,headers={'Accept':'application/json'})
                  data=r.json()
                  print('BRREG',org,'HTTP',r.status_code,'type',type(data).__name__,
                        'length',len(data) if isinstance(data,(list,dict)) else 'n/a',
                        'types',dict(Counter(type(v).__name__ for v in data)) if isinstance(data,list) else list(data)[:8] if isinstance(data,dict) else 'other',flush=True)
                  if isinstance(data,list):
                      for rec in data[:6]:
                          print('BRREG_ROW',org,rec.get('regnskapstype') if isinstance(rec,dict) else type(rec).__name__,
                                rec.get('regnskapsperiode') if isinstance(rec,dict) else None,
                                rec.get('id') if isinstance(rec,dict) else None,flush=True)
              except Exception as e:print('BRREG_PROBE_ERROR',type(e).__name__,str(e)[:100],flush=True)
          try:
              r=requests.get('https://info.nrk.no/karriere/',timeout=20)
              soup=BeautifulSoup(r.text,'html.parser')
              links=[a.get('href','') for a in soup.select('a[href]')]
              external=[v for v in links if 'webcruiter' in v.lower() or 'candidate' in v.lower() or 'recruit' in v.lower()]
              print('NRK HTTP',r.status_code,'anchors',len(links),'old_matches',len(soup.select('a[href*="webcruiter.no/main/recruit/public/"]')),'external_matches',len(external),'url_samples',external[:6],flush=True)
              print('NRK anchor samples',[(a.get('href','')[:90],a.get_text(' ',strip=True)[:75]) for a in soup.select('table a[href]')[:12]],flush=True)
          except Exception as e:print('NRK_PROBE_ERROR',type(e).__name__,str(e)[:100],flush=True)
          try:
              source=p.ParliamentVoteDiscoverySource(SourceConfig(id='live_parliament',kind='parliament_vote_discovery',label='probe',filters=FilterRule(match_all=True),options={'lookback_days':30,'max_sessions':2,'max_meetings':40,'max_cases':200,'max_records':1000,'allow_empty':True}))
              today=datetime.now(timezone.utc).date();first=today-timedelta(days=30)
              sessions=p._sessions(source,first,today);mid=sorted({v for ses in sessions for v,_ in p._meetings(source,ses,first,today)})
              cases={};conflicts={}
              for meeting in mid:
                  for cid,title in p._agenda(source,meeting):
                      if cid in cases and cases[cid]!=title:conflicts.setdefault(cid,set()).update((cases[cid],title))
                      cases.setdefault(cid,title)
              print('STORTING sessions',len(sessions),'meetings',len(mid),'cases',len(cases),'conflicts', {k:[v[:110] for v in sorted(vals)] for k,vals in list(conflicts.items())[:4]},flush=True)
          except Exception as e:print('STORTING_PROBE_ERROR',type(e).__name__,str(e)[:140],flush=True)
          PY
      - run: python -m unittest discover -s tests -v
      - run: python -m watchtower -h
