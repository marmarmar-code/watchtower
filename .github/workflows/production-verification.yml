name: Production verification

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Dispatch production Watchtower
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh workflow run monitor.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f operation=run \
            -f respect_intervals=true

          run_id=""
          for attempt in $(seq 1 15); do
            run_id=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow monitor.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" \
              | head -n 1)
            if [[ -n "$run_id" ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done

          echo "Could not find production verification run for $HEAD_SHA" >&2
          exit 1

      - name: Verify production run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --exit-status
