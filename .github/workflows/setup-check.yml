name: Watchtower setup verification

on:
  schedule:
    - cron: "58 9 20 8 *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/setup-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private runtime with deploy key
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: marmarmar-code/watchtower-runtime
          ref: main
          path: runtime
          ssh-key: ${{ secrets.RUNTIME_DEPLOY_KEY }}

      - name: Prove deploy-key read/write privately
        working-directory: runtime
        run: |
          set -euo pipefail
          git config user.name "watchtower[bot]"
          git config user.email "watchtower[bot]@users.noreply.github.com"
          printf '{"deploy_key":"ok"}\n' > state/setup_deploy_key_ok.json
          git add -- state/setup_deploy_key_ok.json
          git commit --quiet -m "chore: verify watchtower deploy key"
          git push --quiet origin HEAD:main

      - name: Verify Slack webhook
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "SLACK_WEBHOOK_URL is not configured" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            -H 'Content-type: application/json' \
            --data '{"text":"WATCHTOWER · TEST\nSlack-varsling er koblet til og fungerer."}' \
            "$SLACK_WEBHOOK_URL" >/dev/null

      - name: Record successful setup privately
        working-directory: runtime
        run: |
          set -euo pipefail
          git pull --rebase --quiet origin main
          printf '{"slack":"ok"}\n' > state/setup_slack_ok.json
          git add -- state/setup_slack_ok.json
          git commit --quiet -m "chore: verify watchtower Slack"
          git push --quiet origin HEAD:main
