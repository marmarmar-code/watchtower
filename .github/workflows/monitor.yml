name: Watchtower

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation"
        required: true
        default: "run"
        type: choice
        options:
          - run
          - dry-run
          - test-slack
          - test-teams
          - test-notification
      respect_intervals:
        description: "Respect each source polling interval"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: watchtower-monitor
      cancel-in-progress: false
    steps:
      - name: Check out reviewed public source
        id: public_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: public-source
          persist-credentials: false

      - name: Enforce public-source safety
        id: public_safety
        working-directory: public-source
        run: python3 scripts/check_public_safety.py

      - name: Resolve operation
        id: operation
        shell: bash
        run: |
          operation="${{ inputs.operation }}"
          echo "value=$operation" >> "$GITHUB_OUTPUT"

      - name: Check out private runtime
        id: runtime_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.WATCHTOWER_RUNTIME_REPOSITORY || format('{0}/watchtower-runtime', github.repository_owner) }}
          ref: ${{ vars.WATCHTOWER_RUNTIME_REF || 'main' }}
          path: runtime
          ssh-key: ${{ secrets.RUNTIME_DEPLOY_KEY }}

      - name: Set up Python
        id: python_setup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public-source/pyproject.toml

      - name: Install reviewed source
        id: install
        run: |
          python -m pip install ./public-source
          python -m pip check

      - name: Mask private runtime configuration
        id: mask_private
        run: python3 public-source/scripts/mask_private_config.py runtime/config/watchtower.toml

      - name: Validate private runtime and public/private separation
        id: validate_runtime
        run: |
          set -euo pipefail
          python -m watchtower validate-runtime runtime
          python3 public-source/scripts/check_private_leaks.py runtime/config/watchtower.toml public-source

      - name: Test notification
        id: notification_test
        if: >-
          steps.operation.outputs.value == 'test-slack' ||
          steps.operation.outputs.value == 'test-teams' ||
          steps.operation.outputs.value == 'test-notification'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.operation.outputs.value }}" in
            test-slack) python -m watchtower test-slack ;;
            test-teams) python -m watchtower test-teams ;;
            test-notification) python -m watchtower test-notification --config runtime/config/watchtower.toml ;;
          esac

      - name: Record successful setup verification privately
        id: record_setup
        if: steps.notification_test.outcome == 'success'
        run: printf '{"runtime":"ok","notification":"ok"}\n' > runtime/state/setup_verified.json

      - name: Run watchtower
        id: watchtower_run
        if: steps.operation.outputs.value == 'run' || steps.operation.outputs.value == 'dry-run'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DOFFIN_API_KEY: ${{ secrets.DOFFIN_API_KEY }}
          PATENTSTYRET_API_KEY: ${{ secrets.PATENTSTYRET_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.operation.outputs.value }}" == "dry-run" ]]; then
            command=dry-run
          else
            command=run
          fi
          interval_args=()
          if [[ "${{ inputs.respect_intervals }}" == "true" ]]; then
            interval_args+=(--respect-intervals)
          fi
          python -m watchtower "$command" \
            --config runtime/config/watchtower.toml \
            --state-dir runtime/state \
            --redact-output \
            "${interval_args[@]}"

      - name: Summarize private source health
        id: source_health
        if: >-
          always() &&
          steps.runtime_checkout.outcome == 'success' &&
          steps.validate_runtime.outcome == 'success' &&
          (steps.operation.outputs.value == 'run' || steps.operation.outputs.value == 'dry-run')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m watchtower status \
            --config runtime/config/watchtower.toml \
            --state-dir runtime/state \
            --redact-output | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit private state only
        id: commit_state
        if: >-
          always() &&
          steps.runtime_checkout.outcome == 'success' &&
          steps.validate_runtime.outcome == 'success' &&
          (steps.operation.outputs.value == 'run' || steps.notification_test.outcome == 'success')
        working-directory: runtime
        run: |
          set -euo pipefail
          git config user.name "watchtower[bot]"
          git config user.email "watchtower[bot]@users.noreply.github.com"
          git add -- state
          changed=$(git diff --cached --name-only)
          if [[ -n "$changed" ]] && grep -Ev '^state/' <<< "$changed" >/dev/null; then
            echo "Refusing to commit files outside private state/" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Private state unchanged"
            exit 0
          fi
          git commit --quiet -m "chore: update watchtower state"
          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin "${{ vars.WATCHTOWER_RUNTIME_REF || 'main' }}" && \
               git push --quiet origin "HEAD:${{ vars.WATCHTOWER_RUNTIME_REF || 'main' }}"; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          echo "Could not synchronize private runtime state" >&2
          exit 1

      - name: Report setup or monitor failure
        if: >-
          always() &&
          (steps.public_source.outcome == 'failure' ||
           steps.public_safety.outcome == 'failure' ||
           steps.operation.outcome == 'failure' ||
           steps.runtime_checkout.outcome == 'failure' ||
           steps.python_setup.outcome == 'failure' ||
           steps.install.outcome == 'failure' ||
           steps.mask_private.outcome == 'failure' ||
           steps.validate_runtime.outcome == 'failure' ||
           steps.notification_test.outcome == 'failure' ||
           steps.record_setup.outcome == 'failure' ||
           steps.watchtower_run.outcome == 'failure' ||
           steps.source_health.outcome == 'failure' ||
           steps.commit_state.outcome == 'failure')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          PUBLIC_SOURCE_OUTCOME: ${{ steps.public_source.outcome }}
          PUBLIC_SAFETY_OUTCOME: ${{ steps.public_safety.outcome }}
          OPERATION_OUTCOME: ${{ steps.operation.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime_checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python_setup.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          MASK_OUTCOME: ${{ steps.mask_private.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate_runtime.outcome }}
          NOTIFICATION_OUTCOME: ${{ steps.notification_test.outcome }}
          RECORD_SETUP_OUTCOME: ${{ steps.record_setup.outcome }}
          RUN_OUTCOME: ${{ steps.watchtower_run.outcome }}
          HEALTH_OUTCOME: ${{ steps.source_health.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit_state.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen

          stages = (
              ("PUBLIC_SOURCE_OUTCOME", "uthenting av offentlig kildekode"),
              ("PUBLIC_SAFETY_OUTCOME", "sikkerhetskontroll av offentlig kildekode"),
              ("OPERATION_OUTCOME", "valg av operasjon"),
              ("RUNTIME_OUTCOME", "tilgang til privat runtime"),
              ("PYTHON_OUTCOME", "oppsett av Python"),
              ("INSTALL_OUTCOME", "installasjon av Watchtower"),
              ("MASK_OUTCOME", "skjerming av privat konfigurasjon"),
              ("VALIDATE_OUTCOME", "validering av privat runtime"),
              ("NOTIFICATION_OUTCOME", "test av varsling"),
              ("RECORD_SETUP_OUTCOME", "lagring av oppsettskontroll"),
              ("RUN_OUTCOME", "kildekontroll"),
              ("HEALTH_OUTCOME", "helsekontroll"),
              ("COMMIT_OUTCOME", "skriving av privat tilstand"),
          )
          stage = next(
              (label for variable, label in stages if os.environ.get(variable) == "failure"),
              "ukjent steg",
          )
          detail = ""
          try:
              status = json.loads(Path("runtime/state/_status.json").read_text(encoding="utf-8"))
              errors = status.get("errors") if isinstance(status, dict) else None
              if stage == "kildekontroll" and isinstance(errors, dict) and errors:
                  detail = f"{len(errors)} kilde(r) meldte feil"
          except Exception:
              pass

          run_url = os.environ.get("RUN_URL", "")
          text = f"WATCHTOWER · DRIFTSVARSEL\nFeil i: {stage}."
          if detail:
              text += f"\nDetalj: {detail}."
          if run_url:
              text += f"\nKjøring: {run_url}"

          provider = "slack"
          try:
              config_text = Path("runtime/config/watchtower.toml").read_text(encoding="utf-8")
              section = re.search(
                  r"(?ms)^\[notifications\]\s*$\n(.*?)(?=^\[|\Z)",
                  config_text,
              )
              match = re.search(r'(?m)^\s*provider\s*=\s*["\'](slack|teams)["\']', section.group(1)) if section else None
              if match:
                  provider = match.group(1)
          except Exception:
              if os.environ.get("TEAMS_WEBHOOK_URL") and not os.environ.get("SLACK_WEBHOOK_URL"):
                  provider = "teams"

          def payload_for(selected_provider, message):
              if selected_provider == "slack":
                  return {"text": message}
              return {
                  "type": "message",
                  "attachments": [{
                      "contentType": "application/vnd.microsoft.card.adaptive",
                      "contentUrl": None,
                      "content": {
                          "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                          "type": "AdaptiveCard",
                          "version": "1.4",
                          "body": [{"type": "TextBlock", "text": message, "wrap": True}],
                      },
                  }],
              }

          def send(selected_provider, message):
              variable = "SLACK_WEBHOOK_URL" if selected_provider == "slack" else "TEAMS_WEBHOOK_URL"
              webhook = os.environ.get(variable, "").strip()
              parsed = urlparse(webhook)
              if selected_provider == "slack":
                  valid = (
                      parsed.scheme == "https"
                      and parsed.hostname in {"hooks.slack.com", "hooks.slack-gov.com"}
                      and parsed.path.startswith("/services/")
                  )
              else:
                  valid = parsed.scheme == "https" and bool(parsed.hostname)
              if not valid:
                  raise RuntimeError("notification webhook is unavailable")

              body = json.dumps(payload_for(selected_provider, message)).encode("utf-8")
              request = Request(
                  webhook,
                  data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              for attempt in range(1, 4):
                  try:
                      with urlopen(request, timeout=20) as response:
                          status_code = getattr(response, "status", 200)
                      if 200 <= status_code < 300:
                          return
                      retryable = status_code == 429 or status_code >= 500
                  except HTTPError as exc:
                      retryable = exc.code == 429 or exc.code >= 500
                  except URLError:
                      retryable = True
                  if not retryable or attempt == 3:
                      raise RuntimeError("notification delivery failed") from None
                  time.sleep(float(attempt))

          try:
              send(provider, text)
          except Exception as exc:
              print(f"Could not send failure notification: {type(exc).__name__}", file=sys.stderr)
          PY

      - name: Fail job when monitoring failed
        if: >-
          always() &&
          (steps.public_source.outcome == 'failure' ||
           steps.public_safety.outcome == 'failure' ||
           steps.operation.outcome == 'failure' ||
           steps.runtime_checkout.outcome == 'failure' ||
           steps.python_setup.outcome == 'failure' ||
           steps.install.outcome == 'failure' ||
           steps.mask_private.outcome == 'failure' ||
           steps.validate_runtime.outcome == 'failure' ||
           steps.notification_test.outcome == 'failure' ||
           steps.record_setup.outcome == 'failure' ||
           steps.watchtower_run.outcome == 'failure' ||
           steps.source_health.outcome == 'failure' ||
           steps.commit_state.outcome == 'failure')
        run: exit 1
