name: Watchtower

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation"
        required: true
        default: "run"
        type: choice
        options:
          - run
          - dry-run
          - test-slack
          - test-teams
          - test-notification

permissions:
  contents: read

concurrency:
  group: watchtower-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed public source
        id: public_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: public-source
          persist-credentials: false

      - name: Enforce public-source safety
        id: public_safety
        working-directory: public-source
        run: python3 scripts/check_public_safety.py

      - name: Resolve operation
        id: operation
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            operation="run"
          else
            operation="${{ inputs.operation }}"
          fi
          echo "value=$operation" >> "$GITHUB_OUTPUT"

      - name: Check out private runtime
        id: runtime_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.WATCHTOWER_RUNTIME_REPOSITORY || format('{0}/watchtower-runtime', github.repository_owner) }}
          ref: ${{ vars.WATCHTOWER_RUNTIME_REF || 'main' }}
          path: runtime
          ssh-key: ${{ secrets.RUNTIME_DEPLOY_KEY }}

      - name: Set up Python
        id: python_setup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public-source/pyproject.toml

      - name: Install reviewed source
        id: install
        run: |
          python -m pip install ./public-source
          python -m pip check

      - name: Mask private runtime configuration
        id: mask_private
        run: python3 public-source/scripts/mask_private_config.py runtime/config/watchtower.toml

      - name: Validate private runtime and public/private separation
        id: validate_runtime
        run: |
          set -euo pipefail
          python -m watchtower validate-runtime runtime
          python3 public-source/scripts/check_private_leaks.py runtime/config/watchtower.toml public-source

      - name: Test notification
        id: notification_test
        if: >-
          steps.operation.outputs.value == 'test-slack' ||
          steps.operation.outputs.value == 'test-teams' ||
          steps.operation.outputs.value == 'test-notification'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.operation.outputs.value }}" in
            test-slack) python -m watchtower test-slack ;;
            test-teams) python -m watchtower test-teams ;;
            test-notification) python -m watchtower test-notification --config runtime/config/watchtower.toml ;;
          esac

      - name: Record successful setup verification privately
        if: steps.notification_test.outcome == 'success'
        run: printf '{"runtime":"ok","notification":"ok"}\n' > runtime/state/setup_verified.json

      - name: Run watchtower
        id: watchtower_run
        if: steps.operation.outputs.value == 'run' || steps.operation.outputs.value == 'dry-run'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DOFFIN_API_KEY: ${{ secrets.DOFFIN_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.operation.outputs.value }}" == "dry-run" ]]; then
            command=dry-run
          else
            command=run
          fi
          python -m watchtower "$command" \
            --config runtime/config/watchtower.toml \
            --state-dir runtime/state \
            --redact-output

      - name: Commit private state only
        id: commit_state
        if: >-
          always() &&
          steps.runtime_checkout.outcome == 'success' &&
          steps.validate_runtime.outcome == 'success' &&
          (steps.operation.outputs.value == 'run' || steps.notification_test.outcome == 'success')
        working-directory: runtime
        run: |
          set -euo pipefail
          git config user.name "watchtower[bot]"
          git config user.email "watchtower[bot]@users.noreply.github.com"
          git add -- state
          changed=$(git diff --cached --name-only)
          if [[ -n "$changed" ]] && grep -Ev '^state/' <<< "$changed" >/dev/null; then
            echo "Refusing to commit files outside private state/" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Private state unchanged"
            exit 0
          fi
          git commit --quiet -m "chore: update watchtower state"
          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin "${{ vars.WATCHTOWER_RUNTIME_REF || 'main' }}" && \
               git push --quiet origin "HEAD:${{ vars.WATCHTOWER_RUNTIME_REF || 'main' }}"; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          echo "Could not synchronize private runtime state" >&2
          exit 1

      - name: Report setup or monitor failure
        if: >-
          always() &&
          (steps.runtime_checkout.outcome == 'failure' ||
           steps.validate_runtime.outcome == 'failure' ||
           steps.watchtower_run.outcome == 'failure' ||
           steps.commit_state.outcome == 'failure')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUNTIME_OUTCOME: ${{ steps.runtime_checkout.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate_runtime.outcome }}
          RUN_OUTCOME: ${{ steps.watchtower_run.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit_state.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          stage="ukjent steg"
          detail=""
          if [[ "$RUNTIME_OUTCOME" == "failure" ]]; then
            stage="tilgang til privat runtime (deploy key)"
          elif [[ "$VALIDATE_OUTCOME" == "failure" ]]; then
            stage="validering av privat runtime"
          elif [[ "$RUN_OUTCOME" == "failure" ]]; then
            stage="kildekontroll"
            if [[ -f runtime/state/_status.json ]]; then
              detail=$(python -m watchtower.diagnostics runtime/state/_status.json || true)
            fi
          elif [[ "$COMMIT_OUTCOME" == "failure" ]]; then
            stage="skriving av privat state"
          fi
          python3 - "$stage" "$detail" "$RUN_URL" <<'PY'
          import os, sys
          from watchtower.config import load_config
          from watchtower.notifier import build_notifier

          stage, detail, run_url = sys.argv[1:4]
          text = f"WATCHTOWER · DRIFTSVARSEL\nFeil i: {stage}."
          if detail:
              text += f"\nDetalj: {detail}."
          if run_url:
              text += f"\nKjøring: {run_url}"

          provider = "slack"
          try:
              provider = load_config("runtime/config/watchtower.toml").notifications.provider
          except Exception:
              if os.environ.get("TEAMS_WEBHOOK_URL") and not os.environ.get("SLACK_WEBHOOK_URL"):
                  provider = "teams"

          try:
              notifier = build_notifier(
                  provider,
                  slack_url=os.environ.get("SLACK_WEBHOOK_URL", ""),
                  teams_url=os.environ.get("TEAMS_WEBHOOK_URL", ""),
              )
              notifier.send_text(text)
          except Exception as exc:
              print(f"Could not send failure notification: {type(exc).__name__}", file=sys.stderr)
          PY

      - name: Fail job when monitoring failed
        if: >-
          always() &&
          (steps.runtime_checkout.outcome == 'failure' ||
           steps.validate_runtime.outcome == 'failure' ||
           steps.watchtower_run.outcome == 'failure' ||
           steps.commit_state.outcome == 'failure')
        run: exit 1
