name: Watchtower heartbeat

# Separate GitHub Actions schedule from the chained monitor scheduler.
# Detects a missing successful production run even when the scheduler stopped.
on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production heartbeat and alert on state transition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone, timedelta

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"
          title = "Watchtower heartbeat: production monitoring stalled"

          def api(method, path, data=None):
              request = urllib.request.Request(
                  base + path,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "watchtower-heartbeat",
                  },
                  data=json.dumps(data).encode() if data is not None else None,
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          # A failed poll with known isolated source errors is not a scheduler outage.
          # Any completed monitor execution proves that the monitoring chain started.
          runs = api("GET", "/actions/workflows/monitor.yml/runs?branch=main&per_page=15").get("workflow_runs", [])
          now = datetime.now(timezone.utc)
          latest = max(
              (datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
               for run in runs if run.get("event") == "workflow_dispatch"),
              default=None,
          )
          stalled = latest is None or now - latest > timedelta(minutes=35)
          previous_runs = api(
              "GET", "/actions/workflows/monitor-heartbeat.yml/runs?branch=main&per_page=10"
          ).get("workflow_runs", [])
          previous_completed = next(
              (run for run in previous_runs
               if run.get("status") == "completed"
               and run.get("id") != int(os.environ["GITHUB_RUN_ID"])),
              None,
          )
          previously_stalled = (
              previous_completed is not None
              and previous_completed.get("conclusion") == "failure"
          )
          if not stalled:
              print("Monitoring dispatch heartbeat OK")
              raise SystemExit(0)

          elapsed = "unknown" if latest is None else str(int((now - latest).total_seconds() // 60))
          print(f"Monitoring dispatch is stale; last run minutes ago: {elapsed}")
          if previously_stalled:
              print("Existing outage: notification already emitted on previous heartbeat")
              raise SystemExit(1)

          message = (
              "WATCHTOWER · DRIFTSSTOPP\\n"
              "Ingen monitor-kjøring siste 35 minutter. "
              f"https://github.com/{repo}/actions/workflows/monitor.yml"
          )
          slack = os.environ.get("SLACK_WEBHOOK_URL", "")
          teams = os.environ.get("TEAMS_WEBHOOK_URL", "")
          if slack:
              destination, body = slack, {"text": message}
          elif teams:
              destination, body = teams, {"text": message}
          else:
              print("No notification webhook configured; heartbeat job failure is the alert")
              raise SystemExit(1)
          # Avoid redirecting a sensitive webhook URL to a different origin.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None
          try:
              payload = json.dumps(body).encode()
              urllib.request.build_opener(NoRedirect).open(
                  urllib.request.Request(destination, data=payload,
                                         headers={"Content-Type": "application/json"}),
                  timeout=15,
              ).close()
          except (urllib.error.URLError, OSError) as exc:
              print(f"Notification delivery failed: {type(exc).__name__}")
              # Red heartbeat job remains visible for diagnosis.
          raise SystemExit(1)
          PY
