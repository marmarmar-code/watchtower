name: Temporary Doffin live test

on:
  pull_request:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Authenticate, fetch and parse Doffin Public API
        env:
          DOFFIN_API_KEY: ${{ secrets.DOFFIN_API_KEY }}
        run: |
          python - <<'PY'
          from watchtower.config import FilterRule, SourceConfig
          from watchtower.sources.doffin import DoffinSource

          config = SourceConfig(
              id="doffin",
              kind="doffin",
              label="Doffin",
              filters=FilterRule(include_any=("integration-probe",)),
              options={
                  "page_size": 5,
                  "max_pages": 1,
                  "search_queries": [""],
              },
          )
          items = DoffinSource(config).fetch()
          print(f"Doffin live test passed; normalized_items={len(items)}")
          PY
