name: Catalog delivery test

on:
  workflow_dispatch:
  push:
    branches:
      - codex/source-packs-expansion
    paths:
      - .github/catalog-delivery-test-request.json

permissions:
  contents: read

jobs:
  public-catalog-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out public code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate fixed request
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          event = os.environ["EVENT_NAME"]
          if os.environ["REPOSITORY"] != "example-owner/watchtower":
              raise SystemExit("workflow is restricted to the public Watchtower repository")
          if os.environ["REPOSITORY_PRIVATE"] != "false":
              raise SystemExit("public Watchtower repository must remain public")
          if event == "workflow_dispatch":
              Path(os.environ["GITHUB_OUTPUT"]).write_text("authorized=true\n", encoding="utf-8")
              raise SystemExit(0)
          if event != "push":
              raise SystemExit("unsupported trigger")
          before, sha = os.environ["EVENT_BEFORE"], os.environ["EVENT_SHA"]
          parents = subprocess.run(
              ["git", "rev-list", "--parents", "-n", "1", sha],
              check=True, capture_output=True, text=True,
          ).stdout.split()
          if parents != [sha, before]:
              raise SystemExit("push must contain exactly one direct request commit")
          changed = subprocess.run(
              ["git", "diff", "--name-only", before, sha],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()
          request_name = ".github/catalog-delivery-test-request.json"
          if changed != [request_name]:
              raise SystemExit("request commit may change only the fixed request file")
          path = Path(".github/catalog-delivery-test-request.json")
          if not path.exists():
              Path(os.environ["GITHUB_OUTPUT"]).write_text("authorized=false\n", encoding="utf-8")
              raise SystemExit(0)
          value = json.loads(path.read_text(encoding="utf-8"))
          if value != {"operation": "notification-test"}:
              raise SystemExit("request must contain only operation=notification-test")
          Path(os.environ["GITHUB_OUTPUT"]).write_text("authorized=true\n", encoding="utf-8")
          PY

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.gate.outputs.authorized == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install reviewed public code
        if: steps.gate.outputs.authorized == 'true'
        run: |
          python -m pip install .
          python -m pip check

      - name: Fetch and parse all public catalog setups
        if: steps.gate.outputs.authorized == 'true'
        run: python scripts/check_public_sources.py --workers 2 --timeout 20

      - name: Generate and guard ephemeral catalog runtime
        if: steps.gate.outputs.authorized == 'true'
        env:
          CATALOG_RUNTIME: ${{ runner.temp }}/watchtower-catalog-delivery
          CATALOG_RUNTIME_REPOSITORY: example-owner/watchtower-test-runtime
        run: |
          set -euo pipefail
          python scripts/catalog_test_runtime.py generate \
            --runtime "$CATALOG_RUNTIME" --runtime-ref main \
            --runtime-repository "$CATALOG_RUNTIME_REPOSITORY"
          python scripts/catalog_test_runtime.py guard \
            --runtime "$CATALOG_RUNTIME" --runtime-ref main \
            --runtime-repository "$CATALOG_RUNTIME_REPOSITORY"
          python -m watchtower validate-runtime "$CATALOG_RUNTIME"

      - name: Send one representative notification to the isolated test channel
        if: steps.gate.outputs.authorized == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.WATCHTOWER_TEST_SLACK_WEBHOOK_URL }}
          CATALOG_RUNTIME: ${{ runner.temp }}/watchtower-catalog-delivery
        run: >-
          python -m watchtower test-notification
          --config "$CATALOG_RUNTIME/config/watchtower.toml"
